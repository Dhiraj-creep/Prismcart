# Spring Application Name
spring.application.name=prismcart

# Server Configuration (Port 8088 avoids conflict with Oracle TNSLSNR on 8080)
server.port=8088

# Default Database: Embedded H2 Database (persistent file db, zero setup needed for demo & evaluation)
# To use MySQL instead, run with: -Dspring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./prismcart-data;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8088/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson JSON Configuration
spring.jackson.serialization.INDENT_OUTPUT=true